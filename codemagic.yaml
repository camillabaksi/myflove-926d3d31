# Codemagic – iOS-bygge för MyFlove (Capacitor, Swift Package Manager, ingen CocoaPods).
# Inga hemligheter här: Apple-nyckeln läggs in som integration i Codemagic (Teams → Integrations).
workflows:
  ios-release:
    name: Paceable iOS (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Namnet på App Store Connect API-nyckeln du skapar i Codemagic.
      app_store_connect: MyFlove ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: se.myflove.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "se.myflove.app"
      node: 22
      xcode: latest
    scripts:
      - name: Installera bun och JavaScript-beroenden
        script: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile || bun install
      - name: Förbered påminnelseljud
        script: npm run native:prepare
      - name: Synka Capacitor iOS
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx cap sync ios
      - name: Hämta Swift-paket
        script: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Sätt upp kodsignering
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Bygg .ipa
        script: |
          # Byggnumret styrs av CURRENT_PROJECT_VERSION i Xcode-projektet (måste vara högre än senaste TestFlight-bygget).
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Paceable Android (signed release bundle)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Existing release keystore/passwords only; set this secret group in Codemagic.
      groups:
        - paceable_android_signing
      node: 22
      java: 21
    scripts:
      - name: Installera beroenden
        script: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - name: Förbered native-påminnelser
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          npm run native:prepare
          bunx cap sync android
      - name: Kontrollera befintlig signeringsnyckel och bygg
        script: |
          set -eu
          umask 077
          # Decode the existing keystore without printing it or its passwords.
          : "${MYFLOVE_KEYSTORE_BASE64:?Add the existing release keystore to the secret signing group}"
          : "${MYFLOVE_KEYSTORE_PASSWORD:?Missing existing keystore password}"
          : "${MYFLOVE_KEY_ALIAS:?Missing existing key alias}"
          : "${MYFLOVE_KEY_PASSWORD:?Missing existing key password}"
          MYFLOVE_KEYSTORE_FILE="$CM_BUILD_DIR/paceable-release.keystore"
          export MYFLOVE_KEYSTORE_FILE
          printf '%s' "$MYFLOVE_KEYSTORE_BASE64" | base64 --decode > "$MYFLOVE_KEYSTORE_FILE"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
          cd android
          ./gradlew testReleaseUnitTest bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/reports/tests/**
