name: Paceable checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [private-day-context-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Build app
        run: npm run build
