name: Format tester email design
on:
  push:
    branches: [paceable-polished-tester-emails]
    paths: ['.github/workflows/format-polished-tester-emails.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paceable-polished-tester-emails
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/lib/tester-recruitment-mail.server.ts
      - name: Commit formatted file
        run: |
          if ! git diff --quiet -- src/lib/tester-recruitment-mail.server.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/tester-recruitment-mail.server.ts
            git commit -m "Format branded tester email template"
            git push origin HEAD:paceable-polished-tester-emails
          fi
