name: Format tester admin overview
on:
  push:
    branches: [paceable-tester-admin-overview]
    paths: ['.github/workflows/format-tester-admin-overview.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paceable-tester-admin-overview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/pages/admin-testare.tsx
      - name: Commit formatted file
        run: |
          if ! git diff --quiet -- src/pages/admin-testare.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/admin-testare.tsx
            git commit -m "Format tester admin overview"
            git push origin HEAD:paceable-tester-admin-overview
          fi
