name: Format tester follow-ups
on:
  push:
    branches: [paceable-tester-followups]
    paths: ['.github/workflows/format-tester-followups.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paceable-tester-followups
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/pages/admin-testare.tsx src/lib/tester-recruitment.functions.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- src/pages/admin-testare.tsx src/lib/tester-recruitment.functions.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/admin-testare.tsx src/lib/tester-recruitment.functions.ts
            git commit -m "Format tester follow-up files"
            git push origin HEAD:paceable-tester-followups
          fi
